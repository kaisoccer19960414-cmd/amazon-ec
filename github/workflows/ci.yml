name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: JDK 21をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: gradlewに実行権限を付与
        run: chmod +x gradlew

      - name: テストを実行
        run: ./gradlew test --no-daemon