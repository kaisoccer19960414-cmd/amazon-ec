<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カート - Amazon EC</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f7f7f7; color: #222; }
        header { background: #232f3e; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; }
        header a { color: #fff; text-decoration: none; font-size: 13px; margin-left: 16px; }
        main { max-width: 860px; margin: 24px auto; }
        .notice, .empty, .cart { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .notice { background: #e6f4ea; color: #2e7d32; margin-bottom: 16px; }
        .item { display: grid; grid-template-columns: 1fr 120px 100px 90px; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid #eee; }
        .name { font-weight: bold; } .price, .subtotal { font-size: 14px; } .subtotal { font-weight: bold; }
        input { width: 54px; padding: 6px; } button { padding: 8px 12px; border: 0; border-radius: 4px; cursor: pointer; }
        .update { background: #e7e9ec; } .delete { background: #fff; color: #b12704; border: 1px solid #b12704; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; }
        .total { font-size: 20px; font-weight: bold; } .checkout { background: #f0ad4e; font-weight: bold; }
    </style>
</head>
<body>
<header><div>Amazon EC</div><div><a th:href="@{/products}">商品一覧</a><a th:href="@{/account/orders}">注文履歴</a></div></header>
<main>
    <div class="notice" th:if="${message}" th:text="${message}"></div>
    <div class="empty" th:if="${items.isEmpty()}">カートは空です。<a th:href="@{/products}">商品を探す</a></div>
    <div class="cart" th:unless="${items.isEmpty()}">
        <h1>ショッピングカート</h1>
        <div class="item" th:each="item : ${items}">
            <div><div class="name" th:text="${item.product.name}"></div><div class="price" th:text="'¥' + ${@taxCalculator.includedUnitPrice(item.product.price)} + '（税込）'"></div></div>
            <form th:action="@{'/cart/items/' + ${item.id}}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="number" name="quantity" min="0" th:value="${item.quantity}"><button class="update" type="submit">更新</button></form>
            <div class="subtotal" th:text="'小計 ¥' + ${@taxCalculator.includedTotal(item.product.price, item.quantity)}"></div>
            <form th:action="@{'/cart/items/' + ${item.id} + '/delete'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="delete" type="submit">削除</button></form>
        </div>
        <div class="footer"><a th:href="@{/products}">買い物を続ける</a><div><span class="total" th:text="'合計（税込） ¥' + ${total}"></span><form th:action="@{/cart/checkout}" method="post" style="display:inline; margin-left:16px;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="checkout" type="submit">購入手続きへ</button></form></div></div>
    </div>
</main>
</body>
</html>
