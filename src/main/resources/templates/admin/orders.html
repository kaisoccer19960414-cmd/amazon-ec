<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注文管理 - Amazon EC</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f7f7f7; }
        h1 { font-size: 20px; }
        table { border-collapse: collapse; width: 100%; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; font-size: 13px; text-align: left; }
        th { background: #333; color: #fff; }
        .filter { margin-bottom: 16px; }
        .filter a {
            display: inline-block; margin-right: 8px; padding: 4px 10px;
            border-radius: 4px; text-decoration: none; background: #eee; color: #333; font-size: 13px;
        }
        .filter a.active { background: #333; color: #fff; }

        .status { padding: 2px 8px; border-radius: 4px; font-size: 12px; color: #fff; white-space: nowrap; }
        .status-PENDING { background: #999; }
        .status-STOCK_RESERVED { background: #6c8ebf; }
        .status-COMPLETED { background: #2e8b57; }
        .status-COMPENSATING { background: #d99a2b; }
        .status-CANCELLED { background: #888; }
        .status-STOCK_FAILED { background: #b85c5c; }
        .status-COMPENSATION_FAILED { background: #c0392b; font-weight: bold; }

        .search-form { display: flex; margin-bottom: 16px; }
        .search-form input[type="text"] { width: 320px; padding: 6px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; }
        .search-form button { padding: 6px 12px; font-size: 14px; border: 1px solid #333; background: #333; color: #fff; border-radius: 0 4px 4px 0; cursor: pointer; }
        .search-form button:hover { background: #555; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 20px; }
        .pagination a { color: #1a73e8; text-decoration: none; font-size: 13px; }
        .pagination span.disabled { color: #ccc; font-size: 13px; }
        .pagination .page-info { font-size: 13px; color: #666; }
    </style>
</head>
<body>

<h1>注文管理</h1>

<form class="search-form" method="get" th:action="@{/admin/orders}">
    <input type="hidden" name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="注文IDを検索するところ：Enterで検索">
    <button type="submit" aria-label="検索">&#128269;</button>
</form>

<div class="filter">
    <a th:href="@{/admin/orders(keyword=${keyword})}"
       th:classappend="${selectedStatus == null} ? 'active' : ''">すべて</a>
    <a th:each="s : ${statuses}"
       th:href="@{/admin/orders(status=${s}, keyword=${keyword})}"
       th:classappend="${selectedStatus != null and selectedStatus.name() == s.name()} ? 'active' : ''"
       th:text="${s}"></a>
</div>

<table>
    <thead>
    <tr>
        <th>注文ID</th>
        <th>ユーザーID</th>
        <th>商品ID</th>
        <th>数量</th>
        <th>金額(税込)</th>
        <th>予約ID</th>
        <th>決済ID</th>
        <th>ステータス</th>
        <th>作成日時</th>
        <th>更新日時</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.userId}"></td>
        <td th:text="${order.productId}"></td>
        <td th:text="${order.quantity}"></td>
        <td th:text="'¥' + ${order.totalAmount}"></td>
        <td th:text="${order.reservationId}"></td>
        <td th:text="${order.transactionId}"></td>
        <td>
            <span class="status" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
        </td>
        <td th:text="${order.createdAt}"></td>
        <td th:text="${order.updatedAt}"></td>
    </tr>
    <tr th:if="${orders.isEmpty()}">
        <td colspan="10" style="text-align:center; color:#999;">該当する注文はありません</td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${page.totalPages > 1}">
    <a th:if="${!page.first}" th:href="@{/admin/orders(status=${selectedStatus}, keyword=${keyword}, page=${page.number - 1})}">&laquo; 前へ</a>
    <span th:unless="${!page.first}" class="disabled">&laquo; 前へ</span>
    <span class="page-info" th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
    <a th:if="${!page.last}" th:href="@{/admin/orders(status=${selectedStatus}, keyword=${keyword}, page=${page.number + 1})}">次へ &raquo;</a>
    <span th:unless="${!page.last}" class="disabled">次へ &raquo;</span>
</div>

</body>
</html>
