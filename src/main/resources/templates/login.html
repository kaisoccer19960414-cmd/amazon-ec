<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - Amazon EC</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 80px; background: #f7f7f7; }
        .box { background: #fff; padding: 32px; border-radius: 8px; width: 320px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { font-size: 18px; margin-top: 0; }
        input { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .msg { font-size: 13px; margin-bottom: 12px; }
        .error { color: #c0392b; }
        .info { color: #2e8b57; }
        a { font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <h1>ログイン</h1>

    <p class="msg error" th:if="${param.error}">ユーザー名またはパスワードが違います</p>
    <p class="msg info" th:if="${param.logout}">ログアウトしました</p>
    <p class="msg info" th:if="${param.registered}">登録が完了しました。ログインしてください</p>

    <form method="post" th:action="@{/login}">
        <input type="text" name="username" placeholder="ユーザー名" required>
        <input type="password" name="password" placeholder="パスワード" required>
        <button type="submit">ログイン</button>
    </form>

    <p><a th:href="@{/signup}">新規登録はこちら</a></p>
</div>
</body>
</html>
